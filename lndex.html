<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>历史选择模拟</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            width: 90%;
            max-width: 600px;
            padding: 30px;
            text-align: center;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 28px;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
        }
        
        .question {
            font-size: 22px;
            margin-bottom: 25px;
            color: #444;
            font-weight: bold;
        }
        
        .options {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .option {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }
        
        .option-a {
            background-color: #e74c3c;
            color: white;
        }
        
        .option-a:hover {
            background-color: #c0392b;
            transform: translateY(-3px);
        }
        
        .option-b {
            background-color: #2ecc71;
            color: white;
        }
        
        .option-b:hover {
            background-color: #27ae60;
            transform: translateY(-3px);
        }
        
        .result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            background-color: #f8f9fa;
            max-height: 400px;
            overflow-y: auto;
            text-align: left;
            display: none;
        }
        
        .result-item {
            padding: 8px 5px;
            border-bottom: 1px solid #eee;
            font-size: 16px;
        }
        
        .warning {
            color: #e74c3c;
            font-weight: bold;
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background-color: #ffeaea;
            display: none;
        }
        
        .footer {
            margin-top: 30px;
            color: #777;
            font-size: 14px;
        }
        
        .history-note {
            margin-top: 20px;
            padding: 15px;
            background-color: #f9f9f9;
            border-left: 4px solid #3498db;
            text-align: left;
            border-radius: 4px;
            font-size: 15px;
            color: #555;
        }
        
        @media (max-width: 500px) {
            .options {
                flex-direction: column;
                gap: 15px;
            }
            
            .option {
                width: 100%;
            }
            
            h1 {
                font-size: 24px;
            }
            
            .question {
                font-size: 19px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>历史选择模拟</h1>
        
        <div class="question">是否加入国民党？</div>
        
        <div class="options">
            <button class="option option-a" onclick="selectOption('A')">A. 是</button>
            <button class="option option-b" onclick="selectOption('B')">B. 否</button>
        </div>
        
        <div id="result" class="result"></div>
        
        <div id="warning" class="warning">乱填给你枪毙了</div>
        
        <div class="history-note">
            <p><strong>历史背景：</strong> 中国国民党成立于1894年，曾在中国近代史上扮演重要角色。1949年后，国民党退守台湾地区。此页面仅为历史情境模拟，不代表任何政治立场。</p>
        </div>
        
        <div class="footer">
            <p>© 2023 历史教育模拟 | 仅用于教育目的</p>
        </div>
    </div>

    <script>
        function selectOption(choice) {
            const resultDiv = document.getElementById('result');
            const warningDiv = document.getElementById('warning');
            
            // 隐藏警告信息
            warningDiv.style.display = 'none';
            
            // 清空之前的结果
            resultDiv.innerHTML = '';
            
            if (choice === 'A') {
                resultDiv.style.display = 'block';
                for (let i = 1; i <= 100; i++) {
                    const item = document.createElement('div');
                    item.className = 'result-item';
                    item.textContent = `${i}. 反革命`;
                    resultDiv.appendChild(item);
                }
            } else if (choice === 'B') {
                resultDiv.style.display = 'block';
                for (let i = 1; i <= 100; i++) {
                    const item = document.createElement('div');
                    item.className = 'result-item';
                    item.innerHTML = `${i}. 中国人 <span style="color: red;">👍👍👍</span>`;
                    resultDiv.appendChild(item);
                }
            } else {
                warningDiv.style.display = 'block';
            }
            
            // 滚动到结果区域
            resultDiv.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
